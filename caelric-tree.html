<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e8dcc0; --surface:#f3ebd8; --surface2:#f8f2e4; --border:#cbb994; --border-hi:#b8a279;
    --text:#241d14; --dim:#5a4c38; --ghost:#877253;
    --blue:#1f3a70; --blue-mid:#2f4f8c; --blue-deep:#16294f;
    --maroon:#7d2437; --maroon-mid:#96334a; --maroon-bd:rgba(125,36,55,.30); --maroon-bg:rgba(125,36,55,.05);
    --mauve:#6c4a63; --line:#b09a72;

    /* layout metrics — the spine column is exactly --couple wide on every row,
       which is what lets the connector lines be pure CSS */
    --kin:138px; --sov:154px; --con:154px; --couple:322px; --sh:161px;
    --gap:12px; --drop:16px; --stub:18px;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, rgba(255,250,235,.55) 0%, transparent 70%),
      radial-gradient(ellipse 60% 55% at 8% 60%, rgba(150,51,74,.06) 0%, transparent 70%),
      radial-gradient(ellipse 60% 55% at 92% 90%, rgba(31,58,112,.07) 0%, transparent 70%),
      radial-gradient(ellipse 90% 40% at 50% 100%, rgba(150,120,70,.16) 0%, transparent 70%);}

  header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);
    padding:9px 24px 8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 20px;}
  h1{font-family:'Cinzel',serif;font-weight:600;font-size:19px;letter-spacing:.09em;color:var(--blue-deep);}
  .bar{font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:9px;}
  #zl{font-family:'Cinzel',serif;font-size:12px;color:var(--dim);}
  .bar button{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.1em;padding:4px 12px;background:var(--surface);
    border:1px solid var(--border);color:var(--text);cursor:pointer;}
  .bar button:hover{background:var(--surface2);border-color:var(--border-hi);}
  .bar button:focus-visible{outline:2px solid var(--blue-mid);outline-offset:1px;}
  .key{display:flex;gap:14px;flex-wrap:wrap;margin-left:8px;font-family:'Cinzel',serif;font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--dim);}
  .key i{display:inline-block;width:22px;height:3px;vertical-align:2px;margin-right:5px;}

  .viewport{position:relative;z-index:1;overflow:auto;padding:26px 28px 30px;}
  .canvas{position:relative;}
  .stage{position:absolute;top:0;left:0;transform-origin:top left;display:inline-block;}

  /* ---- the ladder: one grid, three columns, spine always centre ---- */
  .ladder{display:grid;grid-template-columns:max-content max-content max-content;
    column-gap:var(--gap);row-gap:calc(var(--drop) + var(--stub));align-items:start;}

  .flank{display:flex;gap:var(--gap);align-items:flex-start;position:relative;align-self:start;}
  .flank.pre{justify-self:end;}
  .flank.post{justify-self:start;}
  .spine{position:relative;align-self:stretch;width:var(--couple);display:flex;flex-direction:column;}
  .tail{flex:1 1 auto;position:relative;min-height:0;}

  /* vertical stub up from a card to the sibling bar */
  .spine::before,.slot::before{content:'';position:absolute;left:50%;top:calc(-1 * var(--stub));
    height:var(--stub);border-left:1px solid var(--line);}
  /* vertical drop, from the bottom of the couple down past anything hanging
     beside it, to the next generation's sibling bar */
  .tail::after{content:'';position:absolute;left:50%;top:0;bottom:calc(-1 * var(--drop));
    border-left:1px solid var(--line);}
  .spine.top::before{display:none;}
  .slot.base::before{border-left-style:dashed;}

  /* the horizontal sibling bar. Each flank draws its half, reaching to the spine centre;
     --fh / --lh are half the width of the first / last slot, set by measure() */
  .flank::after{content:'';position:absolute;top:calc(-1 * var(--stub));height:0;border-top:1px solid var(--line);}
  .flank.pre::after{left:var(--fh,0px);right:calc(-1 * (var(--gap) + var(--sh)));}
  .flank.post::after{left:calc(-1 * (var(--gap) + var(--sh)));right:var(--lh,0px);}
  .flank.bare::after{display:none;}

  /* ---- branch blocks: short collateral lines, drawn as a small centred tree ---- */
  .branch ul{display:flex;justify-content:center;padding:22px 0 0;margin:0;list-style:none;position:relative;}
  .branch li{position:relative;padding:20px 6px 0;list-style:none;display:flex;flex-direction:column;align-items:center;}
  .branch li::before,.branch li::after{content:'';position:absolute;top:0;right:50%;
    border-top:1px solid var(--line);width:50%;height:20px;}
  .branch li::after{right:auto;left:50%;border-left:1px solid var(--line);}
  .branch li:only-child{padding-top:0;}
  .branch li:only-child::before,.branch li:only-child::after{display:none;}
  .branch li:first-child::before{border:0 none;}
  .branch li:last-child::after{border-top:0 none;}
  .branch ul ul::before{content:'';position:absolute;top:0;left:50%;border-left:1px solid var(--line);width:0;height:22px;}
  .branch > ul{padding-top:0;}
  .branch > ul > li{padding-top:0;}
  .branch li.basechild::after{border-left-style:dashed;}
  /* a branch root's own plate matches the sovereign width, so its marriage bar
     sits on the centre line of the block and the stub above it lands true */
  .branch > ul > li > .couple > .card.kin{width:var(--sov);}

  /* ---- plates ---- */
  .couple{display:flex;align-items:stretch;}
  .marr{width:14px;align-self:center;height:6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .couple.solo .marr{display:none;}

  .card{background:var(--surface);border:1px solid var(--border);padding:6px 8px;text-align:left;
    box-shadow:0 1px 0 rgba(255,252,242,.7) inset,0 1px 5px rgba(90,70,35,.09);}
  .card.sov{width:var(--sov);border-left:3px solid var(--blue-mid);border-radius:2px 4px 4px 2px;}
  .card.con{width:var(--con);background:var(--maroon-bg);border:1px solid var(--maroon-bd);border-left:3px solid var(--maroon-bd);}
  .card.kin{width:var(--kin);background:#efe9da;border-left:3px solid #c3b391;}
  .spine .card.kin{width:var(--sov);}
  .card.wide,.spine .card.wide{width:var(--couple);}
  .card.live{background:#eef4f6;border-left-color:#3a6a7a;}
  .card.base{border-left-style:dashed;}
  .card.couch{border-left-color:#2f5d3a;}
  .card.ramp{border-left-color:#8a2a2a;}
  .card.chor{border-left-color:#5a4a8a;}

  .ord{display:block;font-family:'Cinzel',serif;font-size:9.5px;font-weight:700;letter-spacing:.20em;
    color:var(--maroon);text-transform:uppercase;margin-bottom:3px;}
  .nm{display:block;font-family:'Cinzel',serif;font-size:15px;font-weight:600;letter-spacing:.03em;
    line-height:1.2;color:var(--blue-deep);}
  .nm.sm{font-size:12.5px;font-weight:500;color:var(--dim);letter-spacing:.04em;}
  .epi{display:block;font-family:'Cinzel',serif;font-size:11.5px;font-style:italic;color:var(--mauve);margin-top:1px;line-height:1.25;}
  .dt{display:block;font-size:10.5px;color:var(--dim);margin-top:2px;}
  .rg{display:block;font-size:11px;color:var(--text);margin-top:3px;padding-top:3px;border-top:1px solid var(--border);}
  .tag{display:block;font-size:10px;font-style:italic;color:var(--ghost);margin-top:3px;line-height:1.3;}
  .ban{display:inline-block;font-family:'Cinzel',serif;font-size:9px;font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;margin-top:4px;}
  .b-couch{color:#2f5d3a;} .b-ramp{color:#8a2a2a;} .b-chor{color:#5a4a8a;}

  .wed{display:block;font-family:'Cinzel',serif;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--ghost);}
  .cn{display:block;font-family:'Cinzel',serif;font-size:13px;font-weight:500;color:var(--maroon);line-height:1.25;margin-top:2px;}
  .ch{display:block;font-size:11px;color:var(--dim);margin-top:2px;}

</style>
</head>

/* ------------------------------------------------------------------ RENDER */

function marks(p){
  var h = '';
  if(p.tg) h += '<span class="tag">' + p.tg + '</span>';
  if(p.bn) h += '<span class="ban b-' + p.bn + '">' + BAN[p.bn] + '</span>';
  return h;
}

function plate(p){
  var cls = 'card ' + (p.o ? 'sov' : 'kin');
  if(p.lv) cls += ' live';
  if(p.bs) cls += ' base';
  if(p.bn) cls += ' ' + p.bn;
  if(p.wide) cls += ' wide';
  var h = '<div class="' + cls + '">';
  if(p.o)  h += '<span class="ord">' + p.o + '</span>';
  h += '<span class="nm' + (p.o ? '' : ' sm') + '">' + p.n + '</span>';
  if(p.e) h += '<span class="epi">' + p.e + '</span>';
  if(p.d) h += '<span class="dt">' + p.d + '</span>';
  if(p.r) h += '<span class="rg">' + p.r + '</span>';
  return h + marks(p) + '</div>';
}

function consort(c){
  var h = '<div class="card con">';
  if(c.w) h += '<span class="wed">' + c.w + '</span>';
  h += '<span class="cn">' + c.n + '</span>';
  if(c.h) h += '<span class="ch">' + c.h + '</span>';
  if(c.d) h += '<span class="dt">' + c.d + '</span>';
  return h + '</div>';
}

function couple(p){
  if(!p.c) return '<div class="couple solo">' + plate(p) + '</div>';
  return '<div class="couple">' + plate(p) + '<div class="marr"></div>' + consort(p.c) + '</div>';
}

function bnode(x){
  var h = '<li' + (x.p.bs ? ' class="basechild"' : '') + '>' + couple(x.p);
  if(x.k && x.k.length) h += '<ul>' + x.k.map(bnode).join('') + '</ul>';
  return h + '</li>';
}

function slot(item){
  if(item.br) return '<div class="slot"><div class="branch"><ul>' + bnode(item.br) + '</ul></div></div>';
  return '<div class="slot' + (item.bs ? ' base' : '') + '">' + couple(item) + '</div>';
}

function build(){
  var h = '';
  for(var i = 0; i < LINE.length; i++){
    var g = LINE[i];
    /* a row holds one sibling set, so the plates flanking this row's spine are
       the other children of the row above */
    var up = LINE[i - 1] || {older:[], younger:[]};
    var sc = 'spine' + (i === 0 ? ' top' : '') + (i === LINE.length - 1 ? ' end' : '');
    h += '<div class="flank pre">' + up.older.map(slot).join('') + '</div>';
    h += '<div class="' + sc + '">' + couple(g.s)
       + (i === LINE.length - 1 ? '' : '<div class="tail"></div>') + '</div>';
    h += '<div class="flank post">' + up.younger.map(slot).join('') + '</div>';
  }
  document.getElementById('ladder').innerHTML = h;
}

/* the only thing CSS can't work out on its own: how far in the first and last
   slot's centres sit, since a branch block is wider than a plain plate */
function measure(){
  var fl = document.querySelectorAll('.flank');
  for(var i = 0; i < fl.length; i++){
    var f = fl[i], s = f.children;
    if(!s.length){ f.classList.add('bare'); continue; }
    f.classList.remove('bare');
    f.style.setProperty('--fh', (s[0].offsetWidth / 2) + 'px');
    f.style.setProperty('--lh', (s[s.length - 1].offsetWidth / 2) + 'px');
  }
}

/* ------------------------------------------------------------------ ZOOM */

var z = 1,
    st = document.getElementById('stage'),
    cv = document.getElementById('canvas'),
    vp = document.getElementById('vp'),
    zl = document.getElementById('zl');

function ap(recentre){
  st.style.transform = 'scale(' + z + ')';
  zl.textContent = Math.round(z * 100) + '%';
  cv.style.width  = (st.offsetWidth  * z) + 'px';
  cv.style.height = (st.offsetHeight * z) + 'px';
  if(recentre !== false) centre();
}
function centre(){
  var r = document.querySelector('.spine');
  if(!r) return;
  var x = (r.offsetLeft + r.offsetWidth / 2) * z;
  vp.scrollLeft = Math.max(0, x - vp.clientWidth / 2);
}
function zoom(d){ z = Math.min(2, Math.max(.15, Math.round((z + d) * 100) / 100)); ap(); }
function setZoom(v){ z = v; ap(); }
function fit(){
  var pad = 56;
  z = Math.min(1, Math.max(.15, (vp.clientWidth - pad) / st.offsetWidth));
  z = Math.round(z * 100) / 100;
  ap();
}

build();
measure();
ap();
window.addEventListener('load', function(){ measure(); ap(); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ measure(); ap(); });
window.addEventListener('resize', function(){ measure(); ap(false); });
</script>
